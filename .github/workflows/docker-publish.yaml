name: Docker Publish

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - clash/**
      - subscribe/**
      - subconverter/**
      - .github/workflows/docker-publish.yaml
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

  # GitHub Container Registry image settings
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAMESPACE: ${{ vars.DOCKER_IMAGE_NAMESPACE }}
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
  DOCKER_IMAGE_TAGS: ${{ vars.DOCKER_IMAGE_TAGS }}

  # Docker build settings
  DOCKER_BUILD_CONTEXT: ${{ vars.DOCKER_BUILD_CONTEXT }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH }}
  DOCKER_BUILD_PLATFORMS: ${{ vars.DOCKER_BUILD_PLATFORMS }}
  DOCKER_BUILD_TARGET: ${{ vars.DOCKER_BUILD_TARGET }}
  DOCKER_BUILD_ARGS: ${{ vars.DOCKER_BUILD_ARGS }}

  # Optional build arg for Dockerfile
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Docker settings
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          registry="${DOCKER_REGISTRY:-ghcr.io}"
          namespace="${DOCKER_IMAGE_NAMESPACE:-${GITHUB_REPOSITORY_OWNER}}"
          image_name="${DOCKER_IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          build_context="${DOCKER_BUILD_CONTEXT:-.}"
          dockerfile_path="${DOCKERFILE_PATH:-Dockerfile}"
          platforms="${DOCKER_BUILD_PLATFORMS:-linux/amd64,linux/arm64}"
          build_target="${DOCKER_BUILD_TARGET:-}"

          namespace="$(printf '%s' "$namespace" | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')"
          image="${registry}/${namespace}/${image_name}"

          if [ ! -f "$dockerfile_path" ]; then
            echo "Dockerfile not found: $dockerfile_path" >&2
            exit 1
          fi

          raw_tags="${DOCKER_IMAGE_TAGS:-}"
          if [ -z "$raw_tags" ]; then
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              raw_tags="latest,sha-${GITHUB_SHA::7}"
            else
              safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
              raw_tags="${safe_ref},sha-${GITHUB_SHA::7}"
            fi
          fi

          tags=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tags="${tags}${image}:${tag}"$'\n'
          done < <(printf '%s' "$raw_tags" | tr ', ' '\n\n' | sed '/^$/d')

          build_args=""
          if [ -n "${PIP_INDEX_URL:-}" ]; then
            build_args="${build_args}PIP_INDEX_URL=${PIP_INDEX_URL}"$'\n'
          fi
          if [ -n "${DOCKER_BUILD_ARGS:-}" ]; then
            build_args="${build_args}${DOCKER_BUILD_ARGS}"$'\n'
          fi

          {
            echo "registry=$registry"
            echo "image=$image"
            echo "context=$build_context"
            echo "dockerfile=$dockerfile_path"
            echo "platforms=$platforms"
            echo "target=$build_target"
            echo "tags<<EOF"
            printf '%s' "$tags"
            echo "EOF"
            echo "build_args<<EOF"
            printf '%s' "$build_args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.prep.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.prep.outputs.context }}
          file: ${{ steps.prep.outputs.dockerfile }}
          platforms: ${{ steps.prep.outputs.platforms }}
          target: ${{ steps.prep.outputs.target }}
          push: true
          pull: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: ${{ steps.prep.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image
        run: |
          echo "Published image:"
          echo "${{ steps.prep.outputs.image }}"
          echo
          echo "Tags:"
          printf '%s\n' "${{ steps.prep.outputs.tags }}"
